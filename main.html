<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Cá Nhân</title>

    <!-- 1. CSS: Định hình giao diện và màu sắc -->
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --border-color: #e2e8f0;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --primary: #60a5fa;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px 16px;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        #theme-toggle {
            background: none;   
            border: 1px solid var(--border-color);
                color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .post-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .post-card h2 {
            font-size: 1.25rem;
            margin-bottom: 8px;
        }

        .post-card a {
            color: var(--primary);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- 2. HTML: Cấu trúc nội dung -->
    <div class="container">
        <nav>
            <strong>My Blog ✍️</strong>
            <button id="theme-toggle">🌙 Chế độ tối</button>
        </nav>

        <header>
            <h1>Xin chào, tôi là [Tên Bạn] 👋</h1>
            <p>Không gian lưu trữ bài viết và hành trình học tập.</p>
        </header>

        <main>
            <article class="post-card">
                <h2>Bài viết số 1: Tự làm website cá nhân</h2>
                <p>Nội dung tóm tắt của bài viết đầu tiên trên blog...</p>
            </article>
        </main>
    </div>

    <!-- 3. JavaScript: Logic tương tác -->
    <script>
        const button = document.getElementById("theme-toggle");
        const root = document.documentElement;

        // Đọc cấu hình đã lưu
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme) {
            root.setAttribute("data-theme", savedTheme);
            button.textContent = savedTheme === "dark" ? "☀️ Chế độ sáng" : "🌙 Chế độ tối";
        }

        // Lắng nghe sự kiện click
        button.addEventListener("click", () => {
            const currentTheme = root.getAttribute("data-theme");
            const newTheme = currentTheme === "dark" ? "light" : "dark";

            root.setAttribute("data-theme", newTheme);
            button.textContent = newTheme === "dark" ? "☀️ Chế độ sáng" : "🌙 Chế độ tối";
            localStorage.setItem("theme", newTheme);
        });
    </script>
</body>
</html>
